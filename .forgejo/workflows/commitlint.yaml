---
# Reusable workflow: check commit messages against Conventional Commits.
# Works for push events too; the commit range to check is determined from
# the triggering event automatically.
name: 'Reusable · Commit lint'

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
  workflow_call:
    inputs:
      config:
        description: 'Path to the gitlint config (fallback: default from pyrox/actions)'
        type: string
        required: false
        default: '.gitlint'
      commits:
        description: 'Explicit commit range; empty = determine it automatically'
        type: string
        required: false
        default: ''

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check the commit messages
        uses: https://git.zyria.de/pyrox/actions/commitlint@v1
        with:
          config: ${{ inputs.config }}
          commits: ${{ inputs.commits }}
