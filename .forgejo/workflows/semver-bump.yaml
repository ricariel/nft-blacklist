---
# Reusable workflow: raise the version when something about the artefact
# changed.
#
# Runs after a push to main. If only CI scaffolding changed (workflows,
# pre-commit, Renovate configuration), nothing happens. If the Dockerfile,
# an image's content or own source code changed, a new vX.Y.Z tag is created
# — and that one starts build and release as before.
name: 'Reusable · SemVer bump'

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "'true' = only report, change nothing"
        type: string
        required: false
        default: 'true'
  workflow_call:
    inputs:
      release-paths:
        description: 'Paths that count as relevant for the artefact'
        type: string
        required: false
        default: ''
      major-alias:
        description: 'Moving tag that is kept up to date (e.g. v1)'
        type: string
        required: false
        default: ''
      dry-run:
        description: "'true' = only report"
        type: string
        required: false
        default: 'false'

jobs:
  semver-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Raise the version
        uses: https://git.zyria.de/pyrox/actions/semver-bump@v1
        with:
          # NOT the built-in token: a tag pushed with it starts no further
          # workflows (loop guard). But the tag is meant to do exactly
          # that — forgejo-release listens for it. Reproduced: v1.11.0 was
          # created with the built-in token and stayed without a release,
          # while v1.10.6 to v1.10.8 each got one with a regular token.
          token: ${{ secrets.REGISTRY_TOKEN }}
          # Repository-specific values come from repo variables so that this
          # file stays byte-identical in all repositories — the same
          # pattern as IMAGE_NAME/PLATFORMS in docker.yaml.
          release-paths: ${{ inputs.release-paths || vars.SEMVER_RELEASE_PATHS }}
          major-alias: ${{ inputs.major-alias || vars.SEMVER_MAJOR_ALIAS }}
          dry-run: ${{ inputs.dry-run }}
