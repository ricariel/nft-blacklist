---
name: renovate
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '12 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run renovate
        uses: https://git.zyria.de/pyrox/actions/renovate@v1
        with:
          gh-token: ${{ secrets.GITHUB }}
          token: ${{ secrets.RENOVATE_TOKEN }}
          # Keep the bot configuration central without putting it into the
          # repositories:
          #   RENOVATE_GLOBAL_CONFIG  JSON directly as a variable
          #   RENOVATE_CONFIG_REPO    a reference, e.g. pyrox/renovate-config
          # Both can be set at user level in Forgejo and then apply to all
          # repositories. Without either one the default applies.
          config: ${{ vars.RENOVATE_GLOBAL_CONFIG }}
          config-repo: ${{ vars.RENOVATE_CONFIG_REPO }}
          # Only relevant when none of the configuration sources applies. The
          # action derives endpoint, username and preset from the context
          # itself.
          platform: ${{ vars.RENOVATE_PLATFORM }}
          git-author: ${{ vars.RENOVATE_GIT_AUTHOR }}
          preset: ${{ vars.RENOVATE_PRESET }}
          # Early warning, both optional: an Uptime Kuma push URL as a secret
          # and "true" as a variable for the "Renovate coverage" issue.
          heartbeat-url: ${{ secrets.RENOVATE_HEARTBEAT_URL }}
          coverage-report: ${{ vars.RENOVATE_COVERAGE_REPORT }}
