---
name: renovate
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '12 */6 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Run renovate
        uses: https://git.zyria.de/pyrox/actions/renovate@a269dd68a82414587c9c81a4ae9a015c60dc2154 # v1
        with:
          gh-token: ${{ secrets.GITHUB }}
          token: ${{ secrets.RENOVATE_TOKEN }}
