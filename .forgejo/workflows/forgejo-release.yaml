---
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      url:
        description: 'Forgejo instance URL'
        type: string
        required: false
        default: 'https://git.zyria.de'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Upload release assets
        uses: https://git.zyria.de/pyrox/actions/forgejo-release@v1 # v1
        with:
          url: ${{ inputs.url }}
          # Legt ein Release im eigenen Repository an — der eingebaute Token des
          # Laufs genuegt und muss nirgends gepflegt werden.
          token: ${{ secrets.FORGEJO_TOKEN }}
