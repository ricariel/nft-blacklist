---
# Reusable workflow: create CHANGELOG.md from Conventional Commits
name: 'Reusable · Changelog'

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
      - master

  # Can be triggered by hand. The inputs mirror workflow_call so that the
  # interface and the API offer the same settings as a call as a reusable
  # workflow.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch the changelog commit is pushed to'
        type: string
        required: false
        default: 'main'
      config:
        description: 'Path to the git-cliff config (fallback: default from pyrox/actions)'
        type: string
        required: false
        default: 'cliff.toml'
      output:
        description: 'Changelog file'
        type: string
        required: false
        default: 'CHANGELOG.md'

  workflow_call:
    inputs:
      branch:
        description: 'Branch the changelog commit is pushed to'
        type: string
        required: false
        default: 'main'
      config:
        description: 'Path to the git-cliff config (fallback: default from pyrox/actions)'
        type: string
        required: false
        default: 'cliff.toml'
      output:
        description: 'Changelog file'
        type: string
        required: false
        default: 'CHANGELOG.md'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Create the changelog
        uses: https://git.zyria.de/pyrox/actions/changelog@v1
        with:
          token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.branch }}
          config: ${{ inputs.config }}
          output: ${{ inputs.output }}
